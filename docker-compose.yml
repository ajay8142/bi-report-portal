# docker-compose.yml — production topology
#
#   reverse-proxy (nginx, :80, plain HTTP — TLS not terminated)
#        │
#        ├── frontend (nginx, static SPA)
#        └── backend_api upstream (round robin)
#                 ├── backend1
#                 └── backend2
#
# Oracle DB is external — not containerized. Point DB_CONNECT_STRING (in
# backend/.env) at your existing Oracle instance.
#
# No Redis: rate limiting (backend/middleware/rateLimiter.js) is in-memory per
# container. With backend1+backend2 both live, a client can get up to ~2x the
# stated limit before either instance blocks it — see the caveat at the top of
# that file. The nginx-level limits in nginx/conf.d/ratelimit.conf apply across
# both containers and are the real backstop.
#
# Bring up: docker compose up -d --build
# Scale further: docker compose up -d --build --scale backend1=1 (fixed
#   2-node backend by design — see nginx/conf.d/upstream.conf for why a
#   third node needs an explicit service block, not --scale).

networks:
  bip-network:
    driver: bridge

services:
  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bip-backend1
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      PORT: 5000
    networks: [bip-network]
    # No host port published — only reachable through the reverse proxy.

  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bip-backend2
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      PORT: 5000
    networks: [bip-network]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: bip-frontend
    restart: unless-stopped
    networks: [bip-network]

  reverse-proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: bip-reverse-proxy
    restart: unless-stopped
    ports:
      - "80:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
    networks: [bip-network]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
