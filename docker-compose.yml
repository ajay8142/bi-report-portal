# docker-compose.yml — production topology
#
#   reverse-proxy (nginx, :80, plain HTTP — TLS not terminated)
#        │
#        ├── frontend (nginx, static SPA)
#        └── backend (single container)
#
# Oracle DB is external — not containerized. Point DB_CONNECT_STRING (in
# backend/.env) at your existing Oracle instance.
#
# Rate limiting (backend/middleware/rateLimiter.js) is in-memory in the
# single backend process — no cross-container double-counting to worry
# about. The nginx-level limits in nginx/conf.d/ratelimit.conf still apply
# ahead of it as defense in depth.
#
# Bring up: docker compose up -d --build

networks:
  bip-network:
    driver: bridge

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bip-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
    networks:
      - bip-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: bip-frontend
    restart: unless-stopped
    networks:
      - bip-network

  reverse-proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: bip-reverse-proxy
    restart: unless-stopped
    ports:
      - "80:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - bip-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
