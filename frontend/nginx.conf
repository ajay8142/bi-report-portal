# frontend/nginx.conf
# Served by nginxinc/nginx-unprivileged (listens on 8888, runs as non-root).
# This container only serves the built static SPA — the reverse-proxy
# container in front of it handles TLS, load balancing across backends, and
# edge rate limiting (see nginx/nginx.conf at the repo root).

server {
    listen 8888;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Health check for Docker/compose — not the same as the SPA route, so it
    # doesn't fall through to index.html.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Hashed build assets can be cached aggressively; index.html must not be,
    # or clients keep loading a stale SPA shell after a new deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing (react-router) — let the SPA handle unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
