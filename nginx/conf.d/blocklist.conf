# nginx/conf.d/blocklist.conf
# Manual/ad-hoc IP blocking. Open-source nginx has no dynamic ban engine
# (that's what fail2ban/CrowdSec normally drive by rewriting a file like this
# one and issuing `nginx -s reload`) — this file is the hook point for that.
#
# Example:
#   deny 203.0.113.7;
#   deny 198.51.100.0/24;

allow all;
