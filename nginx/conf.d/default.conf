# nginx/conf.d/default.conf
# Single public entry point: terminates TLS, serves the SPA, and reverse
# proxies /api/* to the load-balanced backend upstream.

# Runs under nginxinc/nginx-unprivileged, so it can't bind <1024 as non-root —
# listens on 8080/8443 internally; docker-compose.yml maps host 80->8080 and
# host 443->8443.
#
# Plain HTTP: redirect everything to HTTPS, except health checks (some
# orchestrators/LBs probe over plain HTTP) and the ACME http-01 challenge
# path (kept here so certbot can be dropped in later without touching this
# block — see nginx/ssl/README.md).
server {
    listen 8080;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/acme;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers (defense in depth alongside helmet() in the backend,
    # which already sets most of these on API responses — these cover the
    # static SPA response too).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    limit_conn conn_limit_per_ip 20;

    # --- Static SPA ---
    location / {
        limit_req zone=general_zone burst=30 nodelay;
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Auth: tightest limit, brute-force protection ---
    location = /api/auth/login {
        limit_req zone=login_zone burst=3 nodelay;
        proxy_pass http://backend_api;
        include /etc/nginx/snippets/proxy_headers.conf;
    }

    # --- Report generation + download (single endpoint, streams the file back) ---
    location = /api/client/reports/run {
        limit_req zone=report_zone burst=5 nodelay;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://backend_api;
        include /etc/nginx/snippets/proxy_headers.conf;
    }

    # --- Everything else under /api ---
    location /api/ {
        limit_req zone=general_zone burst=20 nodelay;
        proxy_pass http://backend_api;
        include /etc/nginx/snippets/proxy_headers.conf;
    }
}
