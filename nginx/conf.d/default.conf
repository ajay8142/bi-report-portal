# nginx/conf.d/default.conf
# Single public entry point: serves the SPA and reverse proxies /api/* to the
# load-balanced backend upstream, over plain HTTP.
#
# Runs under nginxinc/nginx-unprivileged, so it can't bind <1024 as non-root —
# listens on 8080 internally; docker-compose.yml maps host 80->8080.
#
# TLS is intentionally not terminated here. To re-enable HTTPS later, restore
# the ssl_certificate/ssl_certificate_key server block (see git history) and
# generate certs per nginx/ssl/README.md.
server {
    listen 8080;
    server_name _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Security headers (defense in depth alongside helmet() in the backend,
    # which already sets most of these on API responses — these cover the
    # static SPA response too).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    limit_conn conn_limit_per_ip 20;

    # --- Static SPA ---
    location / {
        limit_req zone=general_zone burst=30 nodelay;
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Auth: tightest limit, brute-force protection ---
    location = /api/auth/login {
        limit_req zone=login_zone burst=3 nodelay;
        proxy_pass http://backend_api;
        include /etc/nginx/snippets/proxy_headers.conf;
    }

    # --- Report generation + download (single endpoint, streams the file back) ---
    location = /api/client/reports/run {
        limit_req zone=report_zone burst=5 nodelay;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://backend_api;
        include /etc/nginx/snippets/proxy_headers.conf;
    }

    # --- Everything else under /api ---
    location /api/ {
        limit_req zone=general_zone burst=20 nodelay;
        proxy_pass http://backend_api;
        include /etc/nginx/snippets/proxy_headers.conf;
    }
}
