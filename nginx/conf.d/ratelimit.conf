# nginx/conf.d/ratelimit.conf
# Edge-level rate limiting, one zone per route class — same grouping as
# backend/middleware/rateLimiter.js. This layer exists to drop floods before
# they reach Node at all. It's also the one limiter that correctly applies
# across both backend1/backend2 — the Express-level limiter is in-memory per
# container, so treat this nginx layer as the real backstop, not just an
# outer perimeter (see the caveat atop backend/middleware/rateLimiter.js).
limit_req_zone $binary_remote_addr zone=login_zone:10m    rate=5r/m;
limit_req_zone $binary_remote_addr zone=report_zone:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=download_zone:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=general_zone:10m  rate=60r/m;

# Cap concurrent open connections per client IP — cheap defense against
# simple connection-exhaustion floods.
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

limit_req_status 429;
limit_conn_status 429;
