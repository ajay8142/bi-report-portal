# nginx/conf.d/upstream.conf
# Two fixed backend containers (matches docker-compose.yml's backend1/backend2)
# load balanced round-robin (nginx's default algorithm — no directive needed).
# Passive health checks: a backend that fails 3 requests in 30s is taken out
# of rotation for 30s and retried automatically — open-source nginx has no
# active health-check probe, so a hard-down backend is only detected via
# real traffic. Combined with the Docker-level `healthcheck` + `depends_on:
# condition: service_healthy` in compose, a backend that's already unhealthy
# at container level never gets added to rotation in the first place.
upstream backend_api {
    server backend1:5000 max_fails=3 fail_timeout=30s;
    server backend2:5000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream frontend_app {
    server frontend:8080 max_fails=3 fail_timeout=30s;
}
