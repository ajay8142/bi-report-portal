# nginx/conf.d/upstream.conf
# Single backend container (matches docker-compose.yml's backend service).
# max_fails/fail_timeout: after 3 failed requests in 30s, nginx fails fast
# with 502 for 30s instead of repeatedly trying a backend that's down —
# there's no second node to fall back to, but this still avoids piling up
# slow connection attempts against a known-bad instance.
upstream backend_api {
    server backend:5000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream frontend_app {
    server frontend:8888 max_fails=3 fail_timeout=30s;
}
