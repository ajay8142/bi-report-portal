# nginx/nginx.conf
# Main config for the edge reverse-proxy container. Load balances across the
# backend containers, serves as the single entry point for both the frontend
# SPA and the /api surface (plain HTTP — TLS is not terminated here), and
# applies rate limiting ahead of the Node-level limiters in
# backend/middleware/rateLimiter.js (defense in depth: a flood is dropped
# here before it even reaches Node).

# No `user` directive: this runs under nginxinc/nginx-unprivileged, where the
# master process itself is already non-root (not started as root and
# dropping privileges), so `user` would just log a harmless-but-noisy warning.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    # Log to stdout/stderr (12-factor-style) so `docker logs` / your log
    # driver captures everything — no writable log directory needed inside
    # the non-root container.
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 25m; # report parameter payloads / generated file responses

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/xml application/xml+rss image/svg+xml font/woff2;

    # conf.d/blocklist.conf   — extension point for ad-hoc IP blocking (fail2ban, manual bans)
    # conf.d/ratelimit.conf   — limit_req_zone / limit_conn_zone definitions
    # conf.d/upstream.conf    — backend1/backend2 + frontend upstream blocks
    # conf.d/default.conf     — server blocks (HTTP redirect + HTTPS)
    # Zone/upstream definitions are order-independent within http{}, so a
    # single wildcard include is enough — don't also include them individually
    # above, or nginx fails to start with "duplicate zone/upstream" errors.
    include /etc/nginx/conf.d/*.conf;
}
